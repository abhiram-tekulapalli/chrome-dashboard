<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">

        <header class="header stagger-1">
            <div class="time-box">
                <h1 id="clock">00:00</h1>
                <p id="greeting">Initializing...</p>
            </div>
            <div class="controls">
                <button id="btn-focus" class="icon-btn" type="button" title="Zen Mode" aria-label="Toggle zen mode">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
                <button id="btn-bg-default" class="icon-btn" type="button" title="Use Default Abstract Wallpaper"
                    aria-label="Use default abstract wallpaper">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                        <polyline points="3 3 3 9 9 9"></polyline>
                    </svg>
                </button>
                <button id="btn-theme" class="icon-btn" type="button" title="Toggle Theme" aria-label="Toggle theme">
                    <svg id="icon-theme" viewBox="0 0 24 24"></svg>
                </button>
                <button id="btn-data" class="icon-btn" type="button" title="Data Tools" aria-label="Open data tools"
                    aria-expanded="false" aria-controls="data-panel">
                    <svg viewBox="0 0 24 24">
                        <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
                        <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path>
                        <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path>
                    </svg>
                </button>
                <div id="data-panel" class="data-panel" hidden>
                    <button id="btn-export" class="data-btn" type="button">Export Data</button>
                    <button id="btn-import" class="data-btn" type="button">Import Data</button>
                    <button id="btn-reset-all" class="data-btn danger" type="button">Reset Everything</button>
                    <p class="shortcut-hint">Shortcuts: `/` search, `F` zen, `N` shortcut.</p>
                </div>
                <input type="file" id="import-data-input" accept="application/json" hidden>
            </div>
        </header>
        <button id="btn-zen-back" class="zen-back-btn" type="button" aria-label="Exit zen mode" tabindex="-1">
            <svg viewBox="0 0 24 24">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="11 18 5 12 11 6"></polyline>
            </svg>
            Back
        </button>

        <div class="focusable-content">
            <div class="bento calendar-ribbon stagger-2">
                <div class="month-tag" id="cal-month">Month</div>
                <div class="days-container" id="cal-days"></div>
            </div>

            <div class="bento search-box stagger-3">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Search the web..." autocomplete="off" autofocus
                    spellcheck="false">
                <div class="search-engine-wrap">
                    <label for="search-engine">Engine</label>
                    <select id="search-engine" aria-label="Choose search engine"></select>
                </div>
            </div>

            <main class="main-grid stagger-4">

                <div class="bento links-area" id="links-container"></div>

                <aside class="sidebar">

                    <div class="bento side-module pomo-wrap">
                        <div class="module-head" style="margin-bottom: 0;">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                            <span>Focus Timer</span>
                        </div>
                        <div id="pomo-time">25:00</div>
                        <div class="pomo-controls">
                            <button class="pomo-btn" id="btn-pomo-start" type="button">Start</button>
                            <button class="pomo-btn" id="btn-pomo-reset" type="button">Reset</button>
                            <button class="pomo-btn" id="btn-pomo-mode" type="button">Break</button>
                        </div>
                    </div>

                    <div class="bento side-module todo-wrap">
                        <div class="module-head">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z">
                                </path>
                                <path d="m9 12 2 2 4-4"></path>
                            </svg>
                            <span>Action Items</span>
                        </div>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <input type="text" id="input-task" placeholder="What needs to be done?">
                        </div>
                        <ul class="item-list" id="list-tasks"></ul>
                    </div>

                    <div class="bento side-module notes-wrap">
                        <div class="module-head">
                            <svg viewBox="0 0 24 24">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <line x1="10" y1="9" x2="8" y2="9"></line>
                            </svg>
                            <span>Scratchpad</span>
                        </div>
                        <textarea id="scratchpad"
                            placeholder="Jot down quick thoughts. Auto-saves as you type."></textarea>
                    </div>

                </aside>
            </main>
        </div>
    </div>

    <div id="link-modal" class="modal" hidden>
        <div class="bento modal-card" role="dialog" aria-modal="true" aria-labelledby="link-modal-title">
            <h2 id="link-modal-title" class="modal-title">Add Shortcut</h2>
            <div class="modal-field">
                <label for="link-name-input">Name</label>
                <input id="link-name-input" type="text" maxlength="40" placeholder="GitHub">
            </div>
            <div class="modal-field">
                <label for="link-url-input">URL</label>
                <input id="link-url-input" type="text" placeholder="github.com">
            </div>
            <div class="modal-row">
                <button id="link-cancel-btn" class="modal-btn" type="button">Cancel</button>
                <button id="link-save-btn" class="modal-btn primary" type="button">Save Shortcut</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="app/app.js" defer></script>
</body>

</html>
